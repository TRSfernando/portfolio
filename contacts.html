<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Raneesha Fernando</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .contact-wrapper {
            padding: 150px 5% 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 80vh;
        }
        .contact-form-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .form-control {
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-family: "Montserrat", sans-serif;
            transition: all var(--transition-speed);
        }
        .form-control:focus {
            background: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(60, 83, 245, 0.1);
        }
        label {
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #444;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="brand">
                <a href="./index.html"><span class="poppins-semibold" style="font-size: 22px;">Raneesha Fernando</span> <span class="montserrat-thin">| DEVELOPER</span></a>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="./index.html">About Me</a></li>
                    <li><a href="./resume.html">Resume</a></li>
                    <li><a href="./projects.html">Projects</a></li>
                    <li><a href="./contacts.html" style="color: var(--primary-color);">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="contact-wrapper">
        <h1 class="poppins-semibold mb-2" style="font-size: 3rem;">Let's Talk</h1>
        <p class="montserrat-thin mb-5">Have a project in mind or just want to say hi? Drop a message below.</p>

        <div class="contact-form-card">
            <form action="https://formspree.io/f/xdkgondz" method="post" id="contact-form">
                <div class="row">
                    <div class="col-md-6">
                        <label for="fname">First Name*</label>
                        <input type="text" id="fname" name="fname" class="form-control" placeholder="Jane">
                    </div>
                    <div class="col-md-6">
                        <label for="lname">Last Name*</label>
                        <input type="text" id="lname" name="lname" class="form-control" placeholder="Doe">
                    </div>
                </div>
                
                <label for="email">Email Address*</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com">

                <label for="message">Message*</label>
                <textarea id="message" name="message" class="form-control" rows="5" placeholder="How can I help you?"></textarea>

                <button type="submit" class="btn-primary w-100 mt-3 py-3" style="font-size: 1.1rem;">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer">
            <div class="montserrat-thin">&copy; 2026 | Raneesha Fernando</div>
            <div class="footer-right">
                <div><b>Call:</b> +94 77 981 1166</div>
                <div><b>Email:</b> raneesha0925@gmail.com</div>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById("contact-form").addEventListener("submit", function(event) {
            event.preventDefault(); 
            var fname = document.getElementById("fname").value;
            var lname = document.getElementById("lname").value;
            var email = document.getElementById("email").value;
            var message = document.getElementById("message").value;

            if (fname === "" || !/^[a-zA-Z]+$/.test(fname)) {
                alert("Please enter a valid first name containing only letters.");
                document.getElementById('fname').focus();
                return false;
            } 
            if (lname === "" || !/^[a-zA-Z]+$/.test(lname)) {
                alert("Please enter a valid last name containing only letters.");
                document.getElementById('lname').focus();
                return false;
            } 
            if (email === "" || !email.includes("@") || !email.includes(".")) {
                alert("Please enter a valid email address.");
                document.getElementById('email').focus();
                return false;
            } 
            if (message === "") {
                alert("Please fill out the message field.");
                document.getElementById('message').focus();
                return false;
            }
            
            alert("Thank you for your message, " + fname + "! I will get back to you soon.");
            this.submit();
        });
    </script>  
</body>
</html>
